<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFMTA Real-Time Vehicle Tracker</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="muni.css">
</head>
<body>

<header>
  <section class="routes">
    <label for="route-select" class="visually-hidden">Route:</label>
    <select id="route-select">
      <option value="">-- Please choose a route --</option>
    </select>
  </section>
  <div class="header-bottom-row">
    <section class="key">
      <div>
        Inbound
        <svg class="dot-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="8" fill="red" stroke="black" stroke-width="2"/>
        </svg>
        &uarr; &rarr;
      </div>
      <div>
        Outbound
        <svg class="dot-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="8" fill="#a934e5" stroke="black" stroke-width="2"/>
        </svg>
        &darr; &larr;
      </div>
    </section>
    <section class="controls">
      <button id="refresh" aria-label="Refresh vehicle locations">
        <svg class="refresh-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 4v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Refresh</span>
      </button>
    </section>
  </div>
</header>

<main id="map-container">
  <div id="map"></div>
  <div id="loader" class="loader"></div>
</main>

<script src="muni.js"></script>
<!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RFGR9W2JXK');
</script>
</body>
</html>
